<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emily Nguyen Footer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #ffffff;
        --fg: #0a0a0a;
        --muted: #6e6e6e;
        --muted-soft: #9a9a9a;
        --page-pad-x: clamp(1rem, 5vw, 4rem);
        --max-w: 1280px;
        --tracking-tight: -0.1em;
        --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        overflow-x: visible;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        overflow-x: visible;
        background: transparent;
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        font-weight: 500;
        letter-spacing: -0.02em;
        color: var(--fg);
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .site-footer {
        position: relative;
        overflow: visible;
        width: 100%;
        background: var(--bg);
        color: var(--fg);
        padding: clamp(2.5rem, 12vw, 9rem) var(--page-pad-x)
          clamp(1.35rem, 3.5vw, 2rem);
      }

      .footer-display {
        container-type: inline-size;
        width: calc(100% + 2 * var(--page-pad-x));
        margin: 0 calc(-1 * var(--page-pad-x)) clamp(0.5rem, 2vw, 1.25rem);
        padding-inline: clamp(8px, 0.6vw, 16px);
        box-sizing: border-box;
        text-align: center;
        pointer-events: none;
        user-select: none;
        overflow: visible;
      }

      .footer-display__text {
        display: inline-block;
        width: auto;
        margin-inline: auto;
        padding-inline: 0.08em;
        font-family:
          "Helvetica Neue",
          Helvetica,
          Arial,
          sans-serif;
        font-weight: 700;
        font-size: max(0.5rem, calc(100cqw / 7.2));
        line-height: 0.88;
        letter-spacing: var(--tracking-tight);
        white-space: nowrap;
        overflow: visible;
        background-image: linear-gradient(
          180deg,
          #8a8a8a 0%,
          #b8b8b8 42%,
          color-mix(in srgb, var(--bg) 55%, #c8c8c8) 72%,
          var(--bg) 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
      }

      .footer-display__line {
        display: inline;
      }

      .footer-display__sep {
        display: inline-block;
        padding-inline: 0.02em;
        opacity: 0.72;
      }

      .footer-meta {
        position: relative;
        z-index: 1;
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: space-between;
        gap: 1rem 2rem;
        max-width: var(--max-w);
        margin-inline: auto;
        font-size: clamp(0.62rem, 1.1vw + 0.35rem, 0.72rem);
        font-weight: 400;
        line-height: 1.45;
        letter-spacing: 0.03em;
        color: var(--muted-soft);
      }

      .footer-copy {
        margin: 0;
        max-width: 42ch;
      }

      .footer-links {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 0.35rem 1.15rem;
      }

      .footer-links a {
        color: var(--muted);
        opacity: 1;
        transition: color 0.2s var(--ease-out), opacity 0.2s var(--ease-out);
      }

      .footer-links a:hover {
        color: var(--fg);
        opacity: 1;
      }

      @supports not (container-type: inline-size) {
        .footer-display__text {
          font-size: max(0.5rem, calc(100% / 7.2));
        }
      }

      @media (max-width: 720px) {
        .footer-meta {
          flex-direction: column;
          align-items: flex-start;
          gap: 1.1rem;
        }

        .footer-copy {
          max-width: none;
        }

        .footer-links {
          justify-content: flex-start;
          gap: 0.5rem 1rem;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <footer class="site-footer">
      <p class="footer-display">
        <span class="footer-display__text" aria-label="Emily Nguyen"><span class="footer-display__line">Emily</span><span class="footer-display__sep" aria-hidden="true">/</span><span class="footer-display__line">Nguyen</span></span>
      </p>
      <div class="footer-meta">
        <p class="footer-copy">
          &copy; 2026 Emily Nguyen. Design &amp; code.
        </p>
        <nav class="footer-links" aria-label="Footer links">
          <a class="email-link" href="mailto:etn6939@nyu.edu">Email</a>
          <a href="https://www.linkedin.com/in/emilythienanhnguyen" rel="noopener noreferrer">LinkedIn</a>
          <a href="https://drive.google.com/file/d/1rsKlqIr64KdZKxQ3i6sPFWhZQwpWvSFW/view" rel="noopener noreferrer">Resume</a>
          <a href="https://github.com/etn05" rel="noopener noreferrer">GitHub</a>
          <a href="https://www.are.na/emily-nguyen-dmsvjzpdvaa/channels" rel="noopener noreferrer">Are.na</a>
        </nav>
      </div>
    </footer>
    <script>
      (function () {
        function fitFooterWordmark() {
          var container = document.querySelector(".footer-display");
          var text = document.querySelector(".footer-display__text");
          if (!container || !text) return;

          var fitPad = 14;
          var maxWidth = Math.max(0, container.clientWidth - fitPad * 2);
          if (!maxWidth) return;

          var lo = 8;
          var hi = 1200;
          while (lo < hi) {
            var mid = Math.ceil((lo + hi) / 2);
            text.style.fontSize = mid + "px";
            if (text.getBoundingClientRect().width > maxWidth) hi = mid - 1;
            else lo = mid;
          }

          text.style.fontSize = lo + "px";
        }

        function init() {
          fitFooterWordmark();

          var container = document.querySelector(".footer-display");
          if (container && typeof ResizeObserver !== "undefined") {
            new ResizeObserver(fitFooterWordmark).observe(container);
          } else {
            window.addEventListener("resize", fitFooterWordmark);
          }

          if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(fitFooterWordmark);
          }
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", init);
        } else {
          init();
        }
      })();
    </script>
  </body>
</html>
