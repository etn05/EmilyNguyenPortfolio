<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      href="images/favicondark.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      href="images/faviconlight.png"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" type="image/png" href="images/favicondark.png" />
    <title>Emily Nguyen Footer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --fg: #fafafa;
        --pad-x: clamp(1.25rem, 5vw, 4rem);
        --max-w: 1280px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        background: transparent;
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        color: var(--fg);
      }

      .site-footer {
        width: 100%;
        background: #000;
        padding: clamp(2rem, 6vw, 3.5rem) var(--pad-x);
      }

      .footer-row {
        max-width: var(--max-w);
        margin-inline: auto;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 1rem 2rem;
        align-items: end;
      }

      .footer-title {
        margin: 0;
      }

      .footer-wordmark {
        display: inline-block;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-weight: 700;
        letter-spacing: -0.09em;
        font-size: clamp(2.2rem, 6.5vw, 5.4rem);
        line-height: 0.92;
      }

      .footer-links {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 0.6rem 1.1rem;
        font-size: 0.9rem;
      }

      .footer-links a {
        color: inherit;
        text-decoration: none;
        opacity: 0.9;
      }

      .footer-links a:hover {
        opacity: 1;
        text-decoration: underline;
        text-underline-offset: 0.16em;
      }

      .footer-credit {
        max-width: var(--max-w);
        margin: 0.85rem auto 0;
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        opacity: 0.55;
      }

      @media (max-width: 780px) {
        .footer-row {
          grid-template-columns: 1fr;
          align-items: start;
        }

        .footer-links {
          justify-content: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <footer class="site-footer">
      <div class="footer-row">
        <p class="footer-title">
          <span class="footer-wordmark">Emily Nguyen</span>
        </p>
        <nav class="footer-links" aria-label="Footer links">
          <a href="mailto:etn6939@nyu.edu">Email</a>
          <a href="www.linkedin.com/in/emilythienanhnguyen">LinkedIn</a>
          <a href="https://drive.google.com/file/d/1rsKlqIr64KdZKxQ3i6sPFWhZQwpWvSFW/view">Resume</a>
          <a href="https://github.com/etn05">GitHub</a>
          <a href="https://www.are.na/emily-nguyen-dmsvjzpdvaa/channels">Are.na</a>
        </nav>
      </div>
      <p class="footer-credit">Designed/Coded by Emily Nguyen &copy; 2026</p>
    </footer>
  </body>
</html>
