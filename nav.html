<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      href="images/favicondark.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      href="images/faviconlight.png"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" type="image/png" href="images/favicondark.png" />
    <title>Emily Nguyen Nav</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: rgba(255, 255, 255, 0.9);
        --fg: #0a0a0a;
        --pad-x: clamp(1.25rem, 5vw, 4rem);
        --nav-gap: clamp(1.5rem, 4vw, 3rem);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        background: transparent;
        color: var(--fg);
        font-family: "Inter", system-ui, -apple-system, sans-serif;
      }

      .site-header {
        width: 100%;
        min-height: 68px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--nav-gap);
        padding: clamp(1rem, 2.6vw, 1.4rem) var(--pad-x);
        background: var(--bg);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(0, 0, 0, 0.06);
      }

      .logo-mark {
        color: inherit;
        text-decoration: none;
        line-height: 1;
        font-size: clamp(1.75rem, 4vw, 2.35rem);
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 600;
      }

      .nav-links {
        display: flex;
        flex-wrap: wrap;
        gap: clamp(1rem, 3vw, 2rem);
        font-size: 0.95rem;
        letter-spacing: 0.02em;
      }

      .nav-links a {
        color: inherit;
        text-decoration: none;
      }

      .nav-links a:hover {
        text-decoration: underline;
        text-underline-offset: 0.18em;
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a href="index.html" class="logo-mark" aria-label="Home - Emily Nguyen">天</a>
      <nav class="nav-links" aria-label="Primary">
        <a href="#projects">Projects</a>
        <a href="#gallery">Gallery</a>
        <a href="about.html">About</a>
      </nav>
    </header>
  </body>
</html>
