<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emily Nguyen Header</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: rgba(255, 255, 255, 0.92);
        --fg: #0a0a0a;
        --rule: rgba(0, 0, 0, 0.08);
        --page-pad-x: clamp(1rem, 5vw, 4rem);
        --nav-gap: clamp(1.5rem, 4vw, 3rem);
        --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        overflow-x: visible;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        overflow-x: visible;
        background: transparent;
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        font-weight: 500;
        letter-spacing: -0.02em;
        color: var(--fg);
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .site-header {
        width: 100%;
        min-height: 68px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--nav-gap);
        padding: clamp(1.1rem, 2.5vw, 1.35rem) var(--page-pad-x);
        background: var(--bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--rule);
      }

      .logo-mark {
        flex-shrink: 0;
        color: inherit;
        line-height: 1;
        font-size: clamp(1.75rem, 4vw, 2.35rem);
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 500;
        transition: opacity 0.2s var(--ease-out);
      }

      .logo-mark:hover {
        opacity: 0.65;
      }

      .nav-links {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: flex-end;
        gap: clamp(0.75rem, 3vw, 2rem);
        font-size: clamp(0.82rem, 1.5vw + 0.35rem, 0.95rem);
        font-weight: 400;
        letter-spacing: 0;
      }

      .nav-links a {
        background-image: linear-gradient(currentColor, currentColor);
        background-repeat: no-repeat;
        background-position: 0 100%;
        background-size: 0 1px;
        transition: background-size 0.35s var(--ease-out), opacity 0.2s var(--ease-out);
        white-space: nowrap;
      }

      .nav-links a:hover {
        opacity: 1;
        background-size: 100% 1px;
      }

      @media (max-width: 560px) {
        .site-header {
          align-items: flex-start;
          flex-wrap: wrap;
          gap: 0.85rem 1.25rem;
          padding-block: 1rem;
        }

        .nav-links {
          width: 100%;
          justify-content: flex-start;
          gap: 0.65rem 1.1rem;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a
        href="/"
        class="logo-mark"
        aria-label="Home — Emily Nguyen"
        target="_top"
      >天</a>
      <nav class="nav-links" aria-label="Primary">
        <a href="/#projects" target="_top">Projects</a>
        <a href="/#gallery" target="_top">Gallery</a>
        <a
          href="https://medium.com/@emilytnguyen/what-ai-has-really-taken-from-design-rip-internet-slop-73c758ea6c2a"
          rel="noopener noreferrer"
          target="_blank"
          >Blog</a
        >
        <a href="/about.html" target="_top">About</a>
      </nav>
    </header>
  </body>
</html>
