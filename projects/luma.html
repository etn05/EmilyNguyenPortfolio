<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luma — Emily Nguyen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <svg
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
      focusable="false"
      width="0"
      height="0"
      style="position: absolute"
    >
      <defs>
        <filter id="footer-grain" x="-35%" y="-35%" width="170%" height="170%">
          <feTurbulence
            type="fractalNoise"
            baseFrequency="0.75"
            numOctaves="3"
            stitchTiles="stitch"
            seed="91"
            result="noise"
          />
          <feDisplacementMap
            in="SourceGraphic"
            in2="noise"
            scale="14"
            xChannelSelector="R"
            yChannelSelector="G"
          />
        </filter>
      </defs>
    </svg>

    <header class="site-header">
      <a href="../index.html" class="logo-mark" aria-label="Home — Emily Nguyen">天</a>
      <nav class="nav-links" aria-label="Primary">
        <a href="../index.html#projects">Projects</a>
        <a href="../index.html#gallery">Gallery</a>
        <a href="../about.html">About</a>
      </nav>
    </header>

    <main class="section project-page">
      <article class="section__inner">
        <a href="../index.html#projects" class="back-link">← Projects</a>
        <header>
          <h1 class="type-section">Luma</h1>
          <p class="project-meta">
            <span>UX/UI</span>
            <span>Product</span>
            <span>2025</span>
          </p>
        </header>
        <img
          class="project-hero-img"
          src="../images/placeholder.svg"
          alt=""
          width="1200"
          height="675"
        />
        <div class="project-body">
          <p>
            Luma pairs calm landscape photography with restrained UI chrome.
            Replace this scaffolding with annotated screens, journey maps, and any
            motion studies you host elsewhere.
          </p>
          <p>
            Target asset filename: <strong>project-luma.jpg</strong>
          </p>
        </div>
      </article>
    </main>

    <footer class="site-footer">
      <div class="footer-row">
        <p class="type-display footer-title">
          <span class="grain-text">Emily Nguyen</span>
        </p>
        <p class="footer-copy">&copy; 2026</p>
      </div>
    </footer>
  </body>
</html>
